name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout e2e tests (under test)
        uses: actions/checkout@v6
        with:
          path: e2e

      # Cross-repo features: when a sibling repo has a branch with the SAME
      # name as this branch, test against it instead of main — new specs often
      # need unreleased frontend/backend. Falls back to main when absent.
      - name: Resolve sibling refs
        id: refs
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          resolve() {
            if [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads "https://github.com/$1" "$BRANCH" > /dev/null 2>&1; then
              echo "$BRANCH"
            else
              echo "main"
            fi
          }
          FRONTEND_REF=$(resolve AndDev741/Beyou-Frontend)
          BACKEND_REF=$(resolve AndDev741/Beyou-backend-spring)
          echo "frontend=$FRONTEND_REF" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND_REF" >> "$GITHUB_OUTPUT"
          echo "Using frontend=$FRONTEND_REF backend=$BACKEND_REF (branch: $BRANCH)"

      - name: Checkout dev-env
        uses: actions/checkout@v6
        with:
          repository: AndDev741/Beyou-dev-env
          ref: main
          path: dev-env

      - name: Checkout frontend (matched branch or main)
        uses: actions/checkout@v6
        with:
          repository: AndDev741/Beyou-Frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: frontend

      - name: Checkout backend (matched branch or main)
        uses: actions/checkout@v6
        with:
          repository: AndDev741/Beyou-backend-spring
          ref: ${{ steps.refs.outputs.backend }}
          path: backend

      - name: Build web image (from main)
        run: |
          docker build --target nginx \
            --build-arg VITE_API_URL=http://localhost:8099/api/v1 \
            -t beyou-web:e2e -f ./frontend/apps/web/Dockerfile ./frontend

      - name: Get backend image (pull latest, else build from source)
        run: |
          # A matched backend branch means these specs need unreleased backend
          # code — the published :latest (built from main) would fail them.
          if [ "${{ steps.refs.outputs.backend }}" != "main" ]; then
            echo "Building backend from matched branch ${{ steps.refs.outputs.backend }}"
            docker build --target runtime -t beyou-backend:e2e ./backend
          elif docker pull ghcr.io/anddev741/beyou-backend:latest; then
            docker tag ghcr.io/anddev741/beyou-backend:latest beyou-backend:e2e
          else
            docker build --target runtime -t beyou-backend:e2e ./backend
          fi

      - name: Boot the stack
        working-directory: dev-env
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Wait for backend + web to serve
        run: |
          for i in $(seq 1 90); do curl -s -o /dev/null http://localhost:8099 && break; sleep 2; done
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000 && break; sleep 2; done

      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3000 npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      # The server side of a failure. Without this the only evidence a CI-only
      # failure leaves is the status code the client saw, which cannot tell an
      # application refusal from a security-layer one. The frontend repo's own e2e
      # job has dumped these from the start; this one never did.
      - name: Backend logs on failure
        if: failure()
        working-directory: dev-env
        run: docker compose -f docker-compose.e2e.yml logs --tail 400 backend
